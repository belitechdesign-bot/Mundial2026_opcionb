<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>Mundial 2026 Pro</title><style>
:root{--bg:#07111f;--card:#111c31;--card2:#172541;--txt:#f5f7fb;--mut:#9fb0cc;--a:#35e0a1;--b:#2688ff;--warn:#ffd54a;--bad:#ff5b73}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#173760,#07111f 40%,#050914);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--txt)}.wrap{max-width:980px;margin:auto;padding:20px 14px 85px}.head{display:flex;gap:12px;align-items:center}.logo{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-weight:900}.h1{font-size:30px;font-weight:900;line-height:1}.sub{color:var(--mut);margin-top:5px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.btn{border:1px solid #294265;background:var(--card2);color:var(--txt);padding:11px 14px;border-radius:16px;font-weight:800}.btn.on,.btn.primary{background:linear-gradient(135deg,#1fcf8a,#236dff);border-color:#53e0b0}.grid{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:760px){.grid.two{grid-template-columns:1.2fr .8fr}.grid.three{grid-template-columns:repeat(3,1fr)}}.card{background:linear-gradient(180deg,rgba(24,39,68,.96),rgba(12,21,39,.96));border:1px solid #253d61;border-radius:22px;padding:16px;box-shadow:0 14px 40px #0005}.title{font-size:21px;font-weight:900;margin-bottom:10px}.mut{color:var(--mut)}.match{border-top:1px solid #273f63;padding:13px 0}.match:first-child{border-top:0}.teams{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:20px;font-weight:900}.score{background:#07111f;border:1px solid #33486a;border-radius:14px;padding:10px 14px;font-size:24px;min-width:74px;text-align:center}.meta{color:var(--mut);margin:8px 0;line-height:1.45}.list{margin:8px 0 0 0;padding-left:18px;color:#dce8ff}.tag{display:inline-block;padding:6px 10px;border:1px solid #2b456b;border-radius:999px;color:var(--mut);margin:4px}.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{padding:8px;border-bottom:1px solid #263d5e;text-align:left}.tbl th{color:var(--mut);font-weight:800}.tbl td.num{text-align:center}.pill{display:inline-flex;gap:6px;align-items:center}.ok{color:var(--a)}.warn{color:var(--warn)}.bad{color:var(--bad)}input,select{background:#0b1528;border:1px solid #2b456b;border-radius:13px;color:var(--txt);padding:10px;width:100%}.foot{position:fixed;left:0;right:0;bottom:0;background:#06101e;border-top:1px solid #203755;padding:9px;display:flex;gap:7px;justify-content:center;z-index:2}.foot .btn{padding:10px 12px;border-radius:14px;font-size:13px}.small{font-size:12px}.hide{display:none}.krow{display:flex;gap:6px;align-items:center;justify-content:space-between;border-top:1px solid #263d5e;padding:10px 0}.bracket{display:grid;gap:9px}.slot{background:#0a1426;border:1px solid #263d5e;border-radius:14px;padding:10px}.right{text-align:right}.empty{padding:22px;text-align:center;color:var(--mut)}
</style></head><body><div class="wrap"><div class="head"><div class="logo">26</div><div><div class="h1">Mundial 2026 Pro</div><div class="sub">Partidos por día, horarios CDMX, ciudades, grupos, llaves, goleadores y tarjetas.</div></div></div><div class="bar"><button class="btn primary" id="refresh">Actualizar datos</button><button class="btn" id="demo">Cargar ejemplo</button><button class="btn" id="clear">Limpiar</button></div><div class="bar" id="tabs"></div><div id="app"></div></div><div class="foot"><button class="btn" data-tab="today">Hoy</button><button class="btn" data-tab="calendar">Calendario</button><button class="btn" data-tab="groups">Grupos</button><button class="btn" data-tab="bracket">Llaves</button><button class="btn" data-tab="stats">Stats</button></div><script src="live.js"></script><script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script></body></html>
